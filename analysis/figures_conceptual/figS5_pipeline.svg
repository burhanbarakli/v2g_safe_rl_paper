<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 1000 390" width="1000" height="390" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">
  <title>Experimental pipeline: training, zero-shot test grid, comparison and metrics</title>
  <!-- Hand-written. Style follows fig_architecture.svg: dashed = training only, grey fill = safety layer / reference. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222; stroke-width: 1.2; }
      .grp { fill: #f3f3f3; stroke: #222; stroke-width: 1.4; }
      .dash { fill: #ffffff; stroke: #222; stroke-width: 1.4; stroke-dasharray: 5 3; }
      .ref { fill: #dedede; stroke: #000; stroke-width: 2; }
      .ln { stroke: #222; stroke-width: 1.3; fill: none; }
      .lnd { stroke: #222; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; }
      .h { font-weight: bold; font-size: 12.5px; }
      .s { font-size: 10px; }
      .b { font-weight: bold; }
      .lab { font-size: 10px; font-style: italic; }
      .sub { font-size: 8px; }
      .cell { fill: #ffffff; stroke: #444; stroke-width: 0.8; }
      .cellT { fill: #bdbdbd; stroke: #444; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- 1. Training (training only: dashed) -->
  <rect class="dash" x="15" y="40" width="215" height="270" rx="6"/>
  <text class="h" x="122" y="62" text-anchor="middle">1  Training</text>
  <text class="s" x="122" y="77" text-anchor="middle">(learned methods only)</text>
  <rect class="box" x="27" y="88" width="191" height="48" rx="3"/>
  <text x="122" y="106" text-anchor="middle">Station sizes N ∈ {10, 20}</text>
  <text class="s" x="122" y="121" text-anchor="middle">8 + 8 parallel environments,</text>
  <text class="s" x="122" y="132" text-anchor="middle">mixed in every PPO batch</text>
  <rect class="box" x="27" y="144" width="191" height="70" rx="3"/>
  <text x="122" y="162" text-anchor="middle">Per episode, drawn at random:</text>
  <text class="s" x="122" y="177" text-anchor="middle">arrival profile (workplace, public,</text>
  <text class="s" x="122" y="189" text-anchor="middle">private) and tightness level</text>
  <text class="s" x="122" y="203" text-anchor="middle">ρ<tspan class="sub" baseline-shift="sub">tr</tspan> ∈ {4, 7} kW per charger</text>
  <rect class="box" x="27" y="222" width="191" height="58" rx="3"/>
  <text x="122" y="240" text-anchor="middle">PPO, 3 × 10<tspan class="sub" baseline-shift="super">6</tspan> environment steps</text>
  <text class="s" x="122" y="255" text-anchor="middle">5 independent seeds per method;</text>
  <text class="s" x="122" y="268" text-anchor="middle">same tuning budget for every method</text>
  <text class="lab" x="122" y="294" text-anchor="middle">output: frozen policy weights</text>

  <!-- arrow 1 -> 2 -->
  <line class="ln" x1="230" y1="175" x2="258" y2="175" marker-end="url(#arr)"/>

  <!-- 2. Zero-shot test grid -->
  <rect class="grp" x="260" y="40" width="240" height="270" rx="6"/>
  <text class="h" x="380" y="62" text-anchor="middle">2  Zero-shot test grid</text>
  <text class="s" x="380" y="77" text-anchor="middle">same weights, no retraining</text>
  <!-- mini grid: columns N, rows profile x tightness -->
  <text class="s" x="392" y="96" text-anchor="middle">station size N</text>
  <g>
    <text class="s" x="359" y="111" text-anchor="middle">5</text>
    <text class="s" x="383" y="111" text-anchor="middle">10</text>
    <text class="s" x="407" y="111" text-anchor="middle">20</text>
    <text class="s" x="431" y="111" text-anchor="middle">50</text>
    <text class="s" x="455" y="111" text-anchor="middle">100</text>
    <text class="s" x="479" y="111" text-anchor="middle">200</text>
  </g>
  <g>
    <rect class="cell" x="349" y="116" width="20" height="13"/><rect class="cellT" x="373" y="116" width="20" height="13"/><rect class="cellT" x="397" y="116" width="20" height="13"/><rect class="cell" x="421" y="116" width="20" height="13"/><rect class="cell" x="445" y="116" width="20" height="13"/><rect class="cell" x="469" y="116" width="20" height="13"/>
    <rect class="cell" x="349" y="131" width="20" height="13"/><rect class="cellT" x="373" y="131" width="20" height="13"/><rect class="cellT" x="397" y="131" width="20" height="13"/><rect class="cell" x="421" y="131" width="20" height="13"/><rect class="cell" x="445" y="131" width="20" height="13"/><rect class="cell" x="469" y="131" width="20" height="13"/>
    <rect class="cell" x="349" y="146" width="20" height="13"/><rect class="cellT" x="373" y="146" width="20" height="13"/><rect class="cellT" x="397" y="146" width="20" height="13"/><rect class="cell" x="421" y="146" width="20" height="13"/><rect class="cell" x="445" y="146" width="20" height="13"/><rect class="cell" x="469" y="146" width="20" height="13"/>
    <rect class="cell" x="349" y="161" width="20" height="13"/><rect class="cellT" x="373" y="161" width="20" height="13"/><rect class="cellT" x="397" y="161" width="20" height="13"/><rect class="cell" x="421" y="161" width="20" height="13"/><rect class="cell" x="445" y="161" width="20" height="13"/><rect class="cell" x="469" y="161" width="20" height="13"/>
    <rect class="cell" x="349" y="176" width="20" height="13"/><rect class="cellT" x="373" y="176" width="20" height="13"/><rect class="cellT" x="397" y="176" width="20" height="13"/><rect class="cell" x="421" y="176" width="20" height="13"/><rect class="cell" x="445" y="176" width="20" height="13"/><rect class="cell" x="469" y="176" width="20" height="13"/>
    <rect class="cell" x="349" y="191" width="20" height="13"/><rect class="cellT" x="373" y="191" width="20" height="13"/><rect class="cellT" x="397" y="191" width="20" height="13"/><rect class="cell" x="421" y="191" width="20" height="13"/><rect class="cell" x="445" y="191" width="20" height="13"/><rect class="cell" x="469" y="191" width="20" height="13"/>
  </g>
  <g class="s">
    <text x="315" y="133" text-anchor="end">workplace</text>
    <text x="315" y="163" text-anchor="end">public</text>
    <text x="315" y="193" text-anchor="end">private</text>
    <text x="344" y="126" text-anchor="end">4 kW</text>
    <text x="344" y="141" text-anchor="end">7 kW</text>
    <text x="344" y="156" text-anchor="end">4 kW</text>
    <text x="344" y="171" text-anchor="end">7 kW</text>
    <text x="344" y="186" text-anchor="end">4 kW</text>
    <text x="344" y="201" text-anchor="end">7 kW</text>
  </g>
  <rect class="cellT" x="300" y="213" width="14" height="10"/>
  <text class="s" x="319" y="222">sizes seen in training</text>
  <text x="380" y="243" text-anchor="middle">6 × 2 × 3 = 36 configurations</text>
  <text class="s" x="380" y="258" text-anchor="middle">fixed test replays shared by all methods:</text>
  <text class="s" x="380" y="271" text-anchor="middle">100 per configuration (N ≤ 50), 50 (N ≥ 100)</text>
  <text class="s" x="380" y="286" text-anchor="middle">+ literature configuration (EV2Gym</text>
  <text class="s" x="380" y="298" text-anchor="middle">V2GProfitMax, N = 25, 100 replays)</text>

  <!-- arrow 2 -> 3 -->
  <line class="ln" x1="500" y1="175" x2="528" y2="175" marker-end="url(#arr)"/>

  <!-- 3. Methods -->
  <rect class="grp" x="530" y="40" width="215" height="270" rx="6"/>
  <text class="h" x="637" y="62" text-anchor="middle">3  Methods compared</text>
  <text class="s" x="637" y="77" text-anchor="middle">on identical replays (paired)</text>
  <rect class="box" x="542" y="88" width="191" height="66" rx="3"/>
  <text x="637" y="105" text-anchor="middle">Learned (5 seeds each)</text>
  <text class="s b" x="637" y="120" text-anchor="middle">SA-Attn (attention + safety layer)</text>
  <text class="s" x="637" y="133" text-anchor="middle">Attention+penalty, MLP+safety layer,</text>
  <text class="s" x="637" y="146" text-anchor="middle">MLP+penalty</text>
  <rect class="box" x="542" y="162" width="191" height="52" rx="3"/>
  <text x="637" y="179" text-anchor="middle">Rule-based baselines</text>
  <text class="s" x="637" y="194" text-anchor="middle">AFAP, ALAP, Round Robin, LLF</text>
  <text class="s" x="637" y="207" text-anchor="middle">each raw and + safety layer</text>
  <rect class="box" x="542" y="222" width="191" height="44" rx="3"/>
  <text x="637" y="239" text-anchor="middle">EV2Gym economic MPC</text>
  <text class="s" x="637" y="254" text-anchor="middle">raw and + safety layer</text>
  <text class="lab" x="637" y="294" text-anchor="middle">same actuation and admission control</text>

  <!-- arrow 3 -> 4 -->
  <line class="ln" x1="745" y1="175" x2="773" y2="175" marker-end="url(#arr)"/>

  <!-- 4. Metrics -->
  <rect class="grp" x="775" y="40" width="210" height="270" rx="6"/>
  <text class="h" x="880" y="62" text-anchor="middle">4  Metrics per episode</text>
  <text class="s" x="880" y="77" text-anchor="middle">aggregated per configuration and N</text>
  <rect class="box" x="787" y="88" width="186" height="210" rx="3"/>
  <g>
    <text x="799" y="108">profit (€)</text>
    <text x="799" y="132">optimality gap (%)</text>
    <text class="s" x="809" y="145">relative to the LP optimum</text>
    <text x="799" y="169">unserved energy</text>
    <text class="s" x="809" y="182">kWh and % of EVs below E<tspan class="sub" baseline-shift="super">req</tspan></text>
    <text x="799" y="206">transformer violations</text>
    <text class="s" x="809" y="219">steps and kWh above the limit</text>
    <text x="799" y="243">infeasible steps</text>
    <text class="s" x="809" y="256">and fallback activations</text>
    <text x="799" y="280">inference time</text>
    <text class="s" x="809" y="292">ms per control step versus N</text>
  </g>

  <!-- Perfect-information optimum (reference, not a controller) -->
  <rect class="ref" x="530" y="336" width="215" height="54" rx="6"/>
  <text class="h" x="637" y="356" text-anchor="middle">Perfect-information optimum</text>
  <text class="s" x="637" y="371" text-anchor="middle">LP per replay solved with HiGHS</text>
  <text class="s" x="637" y="383" text-anchor="middle">(upper bound on profit, not a controller)</text>
  <path class="ln" d="M500,280 L515,280 L515,363 L528,363" marker-end="url(#arr)"/>
  <path class="ln" d="M745,363 L760,363 L760,132 L785,132" marker-end="url(#arr)"/>
  <text class="lab" x="770" y="378" text-anchor="start">optimum J<tspan class="sub" baseline-shift="super">LP</tspan> per replay</text>

  <!-- statistics note -->
  <text class="lab" x="880" y="330" text-anchor="middle">statistics: seed-level means,</text>
  <text class="lab" x="880" y="343" text-anchor="middle">95 % confidence intervals,</text>
  <text class="lab" x="880" y="356" text-anchor="middle">Wilcoxon signed-rank + Holm</text>

  <!-- legend -->
  <line class="lnd" x1="20" y1="372" x2="60" y2="372"/>
  <text class="s" x="68" y="376">training only</text>
  <rect class="grp" x="20" y="386" width="22" height="14" rx="2"/>
  <text class="s" x="50" y="397">evaluation (all methods)</text>
  <rect class="ref" x="300" y="364" width="22" height="14" rx="2"/>
  <text class="s" x="330" y="375">reference solution</text>
</svg>
