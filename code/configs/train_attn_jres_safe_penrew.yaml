# Mechanism test (review/performance_diagnosis_TR.md Sec. 13): residual policy around the price-LLF rule on the joint
# layer. The raw action is a logit offset from the rule's position r_rule in [l, u]:
# x = l + sigmoid(a + logit r_rule) (u - l) before the projection (safety.action: resid); r_rule is also charger
# feature 12. With the zero-initialised mean head the initial deterministic policy is the rule (up to the 2 % clip of
# r_rule), PPO learns corrections. beta = 0 as for the box action.
inherit: train_attn_joint_safe_penrew.yaml
method: attn_jres_safe_penrew
safety: {action: resid}
ppo: {beta: 0.0}
