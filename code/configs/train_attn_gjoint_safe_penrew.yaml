# Mechanism test (review/performance_diagnosis_TR.md Sec. 13): global features in every charger embedding
# (attention_gin, Sec. 12: better price use and large-N gap, lost to infeasible episodes at small N) on the joint
# layer, which removes most infeasible episodes. PPO hyperparameters of the Deep Sets tuning selection
# (lr 1e-3, minibatch 512, ent_coef 0): the attention tuning ranked candidates by a validation score dominated by
# infeasibility noise (Sec. 11), so the attention selection is not informative on the joint layer.
inherit: train_attn_joint_safe_penrew.yaml
method: attn_gjoint_safe_penrew
model: {arch: attention_gin}
ppo: {lr: 0.001, minibatch: 512, ent_coef: 0.0}
