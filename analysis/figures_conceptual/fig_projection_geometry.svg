<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 532" width="745" height="532" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">
  <title>Safety-layer projection for two EVs</title>
  <!-- Generated by make_projection_geometry.py. Exact example (kW): l = (-5, -3), u = (6, 5),
       C_tilde = 6, C_rev = 4, x = (12, 3); clip(x,l,u) = (6, 3) (sum 9 > 6, infeasible);
       lambda* = 3; x - lambda*1 = (9, 0); p* = clip(x - lambda*1, l, u) = (6, 0), sum = 6 = C_tilde.
       Verified against method/projection_ref.project and a brute-force grid minimisation. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <style>
      .ax { stroke: #777; stroke-width: 1; fill: none; }
      .box { fill: none; stroke: #222; stroke-width: 1.4; }
      .K { fill: #dedede; stroke: #000; stroke-width: 2; }
      .agg { stroke: #222; stroke-width: 1.4; fill: none; }
      .hat { stroke: #222; stroke-width: 1; }
      .guide { stroke: #999; stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
      .shift { stroke: #222; stroke-width: 1.5; stroke-dasharray: 6 3; fill: none; }
      .clipa { stroke: #222; stroke-width: 1.5; fill: none; }
      .naive { stroke: #777; stroke-width: 1.2; stroke-dasharray: 2 2; fill: none; }
      .lab { font-size: 12px; }
      .s { font-size: 11px; }
      .it { font-style: italic; }
      .sub { font-size: 8.5px; }
      .h { font-weight: bold; }
    </style>
  </defs>

  <!-- axes -->
  <line class="ax" x1="70.0" y1="236.0" x2="715.0" y2="236.0" marker-end="url(#arrg)"/>
  <line class="ax" x1="295.0" y1="416.0" x2="295.0" y2="20.0" marker-end="url(#arrg)"/>
  <text class="lab it" x="711.0" y="254.0" text-anchor="end">p<tspan class="sub" baseline-shift="sub">1</tspan> (kW)</text>
  <text class="lab it" x="303.0" y="30.0">p<tspan class="sub" baseline-shift="sub">2</tspan> (kW)</text>
  <text class="s" x="290.0" y="250.0" text-anchor="end">0</text>

  <!-- feasible set K(t) = box ∩ slab -->
  <polygon class="K" points="265.0,326.0 475.0,326.0 475.0,236.0 325.0,86.0 145.0,86.0 145.0,206.0"/>
  <!-- box [l1,u1] x [l2,u2] -->
  <rect class="box" x="145.0" y="86.0" width="330.0" height="240.0"/>
  <!-- guides from box edges to axes -->
  <line class="guide" x1="475.0" y1="326.0" x2="475.0" y2="398.0"/>
  <text class="s it" x="140.0" y="251.0" text-anchor="end">l<tspan class="sub" baseline-shift="sub">1</tspan></text>
  <text class="s it" x="475.0" y="410.0" text-anchor="middle">u<tspan class="sub" baseline-shift="sub">1</tspan></text>
  <text class="s it" x="139.0" y="330.0" text-anchor="end">l<tspan class="sub" baseline-shift="sub">2</tspan></text>
  <text class="s it" x="139.0" y="90.0" text-anchor="end">u<tspan class="sub" baseline-shift="sub">2</tspan></text>

  <!-- aggregate limits (transformer limit) with hatching on the infeasible side -->
  <line class="agg" x1="259.0" y1="20.0" x2="655.0" y2="416.0"/>
  <line class="hat" x1="283.8" y1="44.8" x2="293.4" y2="35.1"/>
  <line class="hat" x1="308.5" y1="69.5" x2="318.1" y2="59.9"/>
  <line class="hat" x1="333.2" y1="94.2" x2="342.8" y2="84.6"/>
  <line class="hat" x1="358.0" y1="119.0" x2="367.6" y2="109.4"/>
  <line class="hat" x1="382.8" y1="143.8" x2="392.3" y2="134.2"/>
  <line class="hat" x1="407.5" y1="168.5" x2="417.1" y2="158.9"/>
  <line class="hat" x1="432.2" y1="193.2" x2="441.8" y2="183.6"/>
  <line class="hat" x1="457.0" y1="218.0" x2="466.6" y2="208.4"/>
  <line class="hat" x1="481.8" y1="242.8" x2="491.4" y2="233.1"/>
  <line class="hat" x1="506.5" y1="267.5" x2="516.1" y2="257.9"/>
  <line class="hat" x1="531.2" y1="292.2" x2="540.8" y2="282.6"/>
  <line class="hat" x1="556.0" y1="317.0" x2="565.6" y2="307.4"/>
  <line class="hat" x1="580.8" y1="341.8" x2="590.3" y2="332.1"/>
  <line class="hat" x1="605.5" y1="366.5" x2="615.1" y2="356.9"/>
  <line class="hat" x1="630.2" y1="391.2" x2="639.9" y2="381.6"/>
  <line class="agg" x1="70.0" y1="131.0" x2="355.0" y2="416.0"/>
  <line class="hat" x1="87.8" y1="148.8" x2="78.2" y2="158.4"/>
  <line class="hat" x1="105.6" y1="166.6" x2="96.0" y2="176.2"/>
  <line class="hat" x1="123.4" y1="184.4" x2="113.8" y2="194.0"/>
  <line class="hat" x1="141.2" y1="202.2" x2="131.6" y2="211.9"/>
  <line class="hat" x1="159.1" y1="220.1" x2="149.5" y2="229.7"/>
  <line class="hat" x1="176.9" y1="237.9" x2="167.3" y2="247.5"/>
  <line class="hat" x1="194.7" y1="255.7" x2="185.1" y2="265.3"/>
  <line class="hat" x1="212.5" y1="273.5" x2="202.9" y2="283.1"/>
  <line class="hat" x1="230.3" y1="291.3" x2="220.7" y2="300.9"/>
  <line class="hat" x1="248.1" y1="309.1" x2="238.5" y2="318.7"/>
  <line class="hat" x1="265.9" y1="326.9" x2="256.3" y2="336.5"/>
  <line class="hat" x1="283.8" y1="344.8" x2="274.1" y2="354.3"/>
  <line class="hat" x1="301.6" y1="362.6" x2="292.0" y2="372.2"/>
  <line class="hat" x1="319.4" y1="380.4" x2="309.8" y2="390.0"/>
  <line class="hat" x1="337.2" y1="398.2" x2="327.6" y2="407.8"/>
  <text class="lab" x="253.0" y="47.0" text-anchor="end"><tspan class="it">p</tspan><tspan class="sub" baseline-shift="sub">1</tspan> + <tspan class="it">p</tspan><tspan class="sub" baseline-shift="sub">2</tspan> = C̃</text>
  <text class="lab" x="76.0" y="386.0" text-anchor="start"><tspan class="it">p</tspan><tspan class="sub" baseline-shift="sub">1</tspan> + <tspan class="it">p</tspan><tspan class="sub" baseline-shift="sub">2</tspan> = −C<tspan class="sub" baseline-shift="sub">rev</tspan></text>
  <text class="lab h" x="214.0" y="170.0" text-anchor="middle">𝒦(t)</text>
  <text class="s" x="214.0" y="185.0" text-anchor="middle">feasible set</text>

  <!-- naive clip (infeasible) -->
  <line class="naive" x1="655.0" y1="146.0" x2="481.0" y2="146.0"/>
  <rect x="470.0" y="141.0" width="10" height="10" fill="#fff" stroke="#555" stroke-width="1.4" transform="rotate(45 475.0 146.0)"/>
  <text class="s" x="484.0" y="123.5">clip(<tspan class="it">x</tspan>, <tspan class="it">l</tspan>, <tspan class="it">u</tspan>): sum &gt; C̃, infeasible</text>

  <!-- raw action x, common shift along (1,1), clip -->
  <line class="shift" x1="650.0" y1="151.0" x2="571.0" y2="230.0" marker-end="url(#arr)"/>
  <line class="clipa" x1="559.0" y1="236.0" x2="483.0" y2="236.0" marker-end="url(#arr)"/>
  <circle cx="655.0" cy="146.0" r="4.5" fill="#111"/>
  <text class="lab" x="664.0" y="140.0">raw action <tspan class="it">x</tspan></text>
  <circle cx="565.0" cy="236.0" r="4.5" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <text class="lab" x="569.0" y="256.0"><tspan class="it">x</tspan> − λ*<tspan class="h">1</tspan></text>
  <text class="s" x="620.0" y="205.0">common shift −λ*(1, 1)</text>
  <text class="s" x="520.0" y="228.0" text-anchor="middle">clip to [<tspan class="it">l</tspan>, <tspan class="it">u</tspan>]</text>
  <rect x="470.0" y="231.0" width="10" height="10" fill="#111"/>
  <text class="lab h" x="467.0" y="256.0" text-anchor="end"><tspan class="it">p</tspan>* = Π<tspan class="sub" baseline-shift="sub">t</tspan>(<tspan class="it">x</tspan>)</text>

  <!-- formula box -->
  <rect x="478.0" y="430.0" width="222.0" height="90.0" rx="3" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text class="lab" x="589.0" y="450.0" text-anchor="middle"><tspan class="it">p</tspan>*<tspan class="sub" baseline-shift="sub">i</tspan> = clip(<tspan class="it">x</tspan><tspan class="sub" baseline-shift="sub">i</tspan> − λ*, <tspan class="it">l</tspan><tspan class="sub" baseline-shift="sub">i</tspan>, <tspan class="it">u</tspan><tspan class="sub" baseline-shift="sub">i</tspan>)</text>
  <text class="s" x="589.0" y="469.0" text-anchor="middle">λ* &gt; 0 solves Σ<tspan class="sub" baseline-shift="sub">i</tspan> clip(<tspan class="it">x</tspan><tspan class="sub" baseline-shift="sub">i</tspan> − λ, <tspan class="it">l</tspan><tspan class="sub" baseline-shift="sub">i</tspan>, <tspan class="it">u</tspan><tspan class="sub" baseline-shift="sub">i</tspan>) = C̃</text>
  <text class="s" x="589.0" y="487.0" text-anchor="middle">(here: one EV clipped at <tspan class="it">u</tspan><tspan class="sub" baseline-shift="sub">1</tspan>, one free)</text>
  <text class="s" x="589.0" y="505.0" text-anchor="middle">λ* = 0 if clip(<tspan class="it">x</tspan>, <tspan class="it">l</tspan>, <tspan class="it">u</tspan>) is already in 𝒦(t)</text>
</svg>
