<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">
  <title>Per-EV lower and upper power bounds from backward reachability</title>
  <!-- Generated by make_lower_bound.py; conceptual (no numbers on the axes). Internal toy values:
       E_min=10, E_req=55, E_cap=60, phi(E)=E+min(6, 0.35(E_cap-E)); B(k)=55,52.31,48.17,42.17,36.17,30.17,24.17,18.17,12.17,10,...;
       t_arr=1, d=12, now t=7, E(t)=27, tau=6: l*dt=3.17, u*dt=6, p_min*dt=-6. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#bbb" stroke-width="1.2"/>
    </pattern>
    <style>
      .ax { stroke: #222; stroke-width: 1.2; fill: none; }
      .guide { stroke: #999; stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
      .latest { stroke: #000; stroke-width: 2; fill: none; }
      .env { stroke: #222; stroke-width: 1.4; fill: none; stroke-dasharray: 6 3; }
      .hist { stroke: #555; stroke-width: 1.4; fill: none; }
      .floor { stroke: #222; stroke-width: 1.2; fill: none; stroke-dasharray: 2 2; }
      .dl { fill: #000; }
      .de { fill: #fff; stroke: #222; stroke-width: 1.2; }
      .dh { fill: #555; }
      .step { stroke: #000; stroke-width: 1.6; fill: none; }
      .lab { font-size: 12px; }
      .s { font-size: 11px; }
      .it { font-style: italic; }
      .sub { font-size: 8.5px; }
      .h { font-weight: bold; }
    </style>
  </defs>

  <!-- region from which E_req can no longer be reached -->
  <polygon points="133.9,380.0 133.9,326.9 172.9,326.9 211.8,326.9 250.7,326.9 289.6,315.4 328.6,283.5 367.5,251.6 406.4,219.7 445.4,187.9 484.3,156.0 523.2,124.1 562.1,102.1 601.1,87.8 601.1,380.0" fill="url(#hatch)" stroke="none"/>
  <rect x="178.7" y="334.1" width="144" height="32" fill="#fff"/>
  <text class="s" x="250.7" y="347.1" text-anchor="middle">departure energy</text>
  <text class="s" x="250.7" y="361.1" text-anchor="middle">requirement unreachable</text>

  <!-- axes -->
  <line class="ax" x1="95" y1="380" x2="665" y2="380" marker-end="url(#arr)"/>
  <line class="ax" x1="95" y1="380" x2="95" y2="25" marker-end="url(#arr)"/>
  <text class="lab" x="665.0" y="412" text-anchor="end">time step</text>
  <text class="lab" x="85" y="18" text-anchor="start">battery energy <tspan class="it">E</tspan><tspan class="sub" baseline-shift="sub">i</tspan></text>

  <!-- energy levels -->
  <line class="guide" x1="95" y1="61.2" x2="624.4" y2="61.2"/>
  <text class="s it" x="89" y="65.2" text-anchor="end">E<tspan class="sub" baseline-shift="super">cap</tspan></text>
  <line class="guide" x1="95" y1="87.8" x2="601.1" y2="87.8"/>
  <text class="s it" x="89" y="91.8" text-anchor="end">E<tspan class="sub" baseline-shift="super">req</tspan></text>
  <line class="floor" x1="95" y1="326.9" x2="624.4" y2="326.9"/>
  <text class="s it" x="89" y="330.9" text-anchor="end">E<tspan class="sub" baseline-shift="super">min</tspan></text>
  <text class="s" x="624.4" y="321.9" text-anchor="end">discharge floor</text>
  <text class="s it" x="89" y="240.6" text-anchor="end">E<tspan class="sub" baseline-shift="sub">i</tspan>(t)</text>
  <line class="guide" x1="95" y1="236.6" x2="367.5" y2="236.6"/>

  <!-- time markers -->
  <line class="guide" x1="133.9" y1="380" x2="133.9" y2="284.4"/>
  <text class="s it" x="133.9" y="396" text-anchor="middle">t<tspan class="sub" baseline-shift="sub">i</tspan><tspan class="sub" baseline-shift="super">arr</tspan></text>
  <line class="guide" x1="367.5" y1="380" x2="367.5" y2="236.6"/>
  <text class="s it" x="367.5" y="396" text-anchor="middle">t</text>
  <line class="guide" x1="406.4" y1="380" x2="406.4" y2="204.7"/>
  <text class="s it" x="406.4" y="396" text-anchor="middle">t+1</text>
  <line class="guide" x1="562.1" y1="380" x2="562.1" y2="102.1"/>
  <text class="s it" x="562.1" y="396" text-anchor="middle">d<tspan class="sub" baseline-shift="sub">i</tspan></text>
  <line class="guide" x1="601.1" y1="380" x2="601.1" y2="87.8"/>
  <text class="s it" x="601.1" y="396" text-anchor="middle">d<tspan class="sub" baseline-shift="sub">i</tspan>+1</text>
  <path class="ax" d="M367.5,404 L367.5,409 L601.1,409 L601.1,404" style="stroke-width:1"/>
  <text class="s" x="484.3" y="423" text-anchor="middle">τ<tspan class="sub" baseline-shift="sub">i</tspan>(t) = d<tspan class="sub" baseline-shift="sub">i</tspan> − t + 1 remaining actions</text>

  <!-- history -->
  <polyline class="hist" points="133.9,284.4 172.9,252.5 211.8,231.2 250.7,247.2 289.6,268.4 328.6,263.1 367.5,236.6"/>
  <circle class="dh" cx="133.9" cy="284.4" r="2.6"/>
  <circle class="dh" cx="172.9" cy="252.5" r="2.6"/>
  <circle class="dh" cx="211.8" cy="231.2" r="2.6"/>
  <circle class="dh" cx="250.7" cy="247.2" r="2.6"/>
  <circle class="dh" cx="289.6" cy="268.4" r="2.6"/>
  <circle class="dh" cx="328.6" cy="263.1" r="2.6"/>
  <text class="s" x="192.3" y="212.7" text-anchor="middle">past energy <tspan class="it">E</tspan><tspan class="sub" baseline-shift="sub">i</tspan></text>

  <!-- latest-start trajectory (thresholds B(k)) -->
  <polyline class="latest" points="133.9,326.9 172.9,326.9 211.8,326.9 250.7,326.9 289.6,315.4 328.6,283.5 367.5,251.6 406.4,219.7 445.4,187.9 484.3,156.0 523.2,124.1 562.1,102.1 601.1,87.8"/>
  <circle class="dl" cx="133.9" cy="326.9" r="2.6"/>
  <circle class="dl" cx="172.9" cy="326.9" r="2.6"/>
  <circle class="dl" cx="211.8" cy="326.9" r="2.6"/>
  <circle class="dl" cx="250.7" cy="326.9" r="2.6"/>
  <circle class="dl" cx="289.6" cy="315.4" r="2.6"/>
  <circle class="dl" cx="328.6" cy="283.5" r="2.6"/>
  <circle class="dl" cx="367.5" cy="251.6" r="2.6"/>
  <circle class="dl" cx="406.4" cy="219.7" r="2.6"/>
  <circle class="dl" cx="445.4" cy="187.9" r="2.6"/>
  <circle class="dl" cx="484.3" cy="156.0" r="2.6"/>
  <circle class="dl" cx="523.2" cy="124.1" r="2.6"/>
  <circle class="dl" cx="562.1" cy="102.1" r="2.6"/>
  <circle class="dl" cx="601.1" cy="87.8" r="2.6"/>
  <text class="s h" x="311.1" y="130.3">latest-start trajectory</text>
  <text class="s" x="311.1" y="144.3">(full power from <tspan class="it">B̂</tspan><tspan class="sub" baseline-shift="sub">i</tspan>(<tspan class="it">k</tspan>), reaching</text>
  <text class="s" x="311.1" y="158.3"><tspan class="it">E</tspan><tspan class="sub" baseline-shift="super">req</tspan> exactly at <tspan class="it">d</tspan><tspan class="sub" baseline-shift="sub">i</tspan>+1)</text>
  <line class="guide" x1="390.9" y1="163.3" x2="439.5" y2="190.9" style="stroke:#555"/>
  <text class="s" x="591.3" y="146.2" text-anchor="start">taper:</text>
  <text class="s" x="591.3" y="160.2" text-anchor="start">slower near full</text>
  <line class="guide" x1="589.4" y1="138.3" x2="546.6" y2="111.2"/>

  <!-- upper envelope from now -->
  <polyline class="env" points="367.5,236.6 406.4,204.7 445.4,172.8 484.3,140.9 523.2,113.0 562.1,94.9 601.1,83.1"/>
  <circle class="de" cx="406.4" cy="204.7" r="2.6"/>
  <circle class="de" cx="445.4" cy="172.8" r="2.6"/>
  <circle class="de" cx="484.3" cy="140.9" r="2.6"/>
  <circle class="de" cx="523.2" cy="113.0" r="2.6"/>
  <circle class="de" cx="562.1" cy="94.9" r="2.6"/>
  <circle class="de" cx="601.1" cy="83.1" r="2.6"/>
  <text class="s" x="505.7" y="85.2" text-anchor="end">upper envelope: maximum</text>
  <text class="s" x="505.7" y="99.2" text-anchor="end">charging from now, Ψ<tspan class="sub" baseline-shift="sub">i,k</tspan>(<tspan class="it">E</tspan><tspan class="sub" baseline-shift="sub">i</tspan>(<tspan class="it">t</tspan>))</text>

  <!-- the three one-step targets at t+1 -->
  <line class="step" x1="367.5" y1="236.6" x2="402.4" y2="206.7" marker-end="url(#arr)"/>
  <line class="step" x1="367.5" y1="236.6" x2="401.4" y2="220.7" marker-end="url(#arr)"/>
  <line class="step" x1="367.5" y1="236.6" x2="402.4" y2="266.4" marker-end="url(#arr)" style="stroke:#777"/>
  <circle cx="367.5" cy="236.6" r="4.5" fill="#111"/>
  <!-- allowed interval at t+1 -->
  <line x1="415.4" y1="219.7" x2="415.4" y2="204.7" stroke="#000" stroke-width="3"/>
  <text class="s" x="428.4" y="208.7"><tspan class="it">E</tspan><tspan class="sub" baseline-shift="sub">i</tspan> + Δ<tspan class="it">t</tspan> <tspan class="it">u</tspan><tspan class="sub" baseline-shift="sub">i</tspan></text>
  <text class="s" x="428.4" y="225.7"><tspan class="it">E</tspan><tspan class="sub" baseline-shift="sub">i</tspan> + Δ<tspan class="it">t</tspan> <tspan class="it">l</tspan><tspan class="sub" baseline-shift="sub">i</tspan> = <tspan class="it">B̂</tspan><tspan class="sub" baseline-shift="sub">i</tspan>(τ<tspan class="sub" baseline-shift="sub">i</tspan> − 1)</text>
  <text class="s" x="428.4" y="272.4" fill="#555"><tspan class="it">E</tspan><tspan class="sub" baseline-shift="sub">i</tspan> + Δ<tspan class="it">t</tspan> <tspan class="it">p</tspan><tspan class="sub" baseline-shift="sub">i</tspan><tspan class="sub" baseline-shift="super">min</tspan> (maximum V2G discharging)</text>

  <!-- explanation box -->
  <rect x="108.6" y="42.7" width="208" height="76" rx="3" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <text class="s h" x="118.6" y="59.7">minimum power now, <tspan class="it">l</tspan><tspan class="sub" baseline-shift="sub">i</tspan>(<tspan class="it">t</tspan>):</text>
  <text class="s" x="118.6" y="74.7">the smallest <tspan class="it">p</tspan> that keeps <tspan class="it">E</tspan><tspan class="sub" baseline-shift="sub">i</tspan>(<tspan class="it">t</tspan>+1)</text>
  <text class="s" x="118.6" y="89.7">on or above the latest-start trajectory;</text>
  <text class="s" x="118.6" y="104.7"><tspan class="it">l</tspan><tspan class="sub" baseline-shift="sub">i</tspan> &lt; 0 would permit V2G discharging</text>
</svg>
