# Mechanism test (review/performance_diagnosis_TR.md Sec. 13): residual around the price-LLF rule as
# attn_jres_safe_penrew, with r_rule clipped to [0.15, 0.85] instead of [0.02, 0.98]. The rule is mostly bang-bang
# (r_rule at a clip bound); at 0.02 / 0.98 the sigmoid is saturated (slope 0.02) and exploration barely changes the
# applied power, so PPO stayed at the rule (mid-training check). At 0.15 / 0.85 the slope is 0.13.
inherit: train_attn_jres_safe_penrew.yaml
method: attn_jres2_safe_penrew
safety: {resid_rmin: 0.15}
