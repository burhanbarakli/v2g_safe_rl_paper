[build-system]
requires = ["setuptools>=61,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2gsafe"
version = "0.1.0"
description = "Attention-based safe RL for scale-agnostic, constraint-guaranteed V2G charging control (EV2Gym)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Ranges known to be API-compatible; the exact versions tested are pinned in requirements.txt.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.1",
  "highspy>=1.7",
  "scikit-learn>=1.3",
  "gymnasium>=0.29",
  "matplotlib>=3.7",
  # EV2Gym (installed separately at the pinned commit, scripts/install_ev2gym.sh) imports these:
  "pandapower>=2.13",
  "numba>=0.57",
  "multicopula>=0.0.2",
  "psutil>=5.9",
  "networkx>=3.0",
  "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
parquet = ["pyarrow>=14"]
gurobi = ["gurobipy>=11"]      # only for the EV2Gym eMPC baseline (restricted licence: N <= 25)

[tool.setuptools.packages.find]
include = ["v2gsafe*"]

[tool.setuptools.package-data]
v2gsafe = ["specs/*.json", "baselines/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
