<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">
  <title>Attention policy with safety layer: architecture and control loop</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222; stroke-width: 1.2; }
      .grp { fill: #f3f3f3; stroke: #222; stroke-width: 1.4; }
      .safe { fill: #dedede; stroke: #000; stroke-width: 2; }
      .dash { fill: #ffffff; stroke: #222; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .ln { stroke: #222; stroke-width: 1.3; fill: none; }
      .lnd { stroke: #222; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; }
      .h { font-weight: bold; font-size: 12.5px; }
      .s { font-size: 10px; }
      .lab { font-size: 10px; font-style: italic; }
      .sub { font-size: 8px; }
    </style>
  </defs>

  <!-- 1. Environment -->
  <rect class="grp" x="20" y="70" width="160" height="230" rx="6"/>
  <text class="h" x="100" y="90" text-anchor="middle">Environment</text>
  <text class="s" x="100" y="104" text-anchor="middle">(EV2Gym, pinned commit)</text>
  <rect class="box" x="32" y="116" width="136" height="52" rx="3"/>
  <text x="100" y="134" text-anchor="middle">Station with N chargers</text>
  <text class="s" x="100" y="148" text-anchor="middle">EVs arrive and depart;</text>
  <text class="s" x="100" y="160" text-anchor="middle">V2G charging/discharging</text>
  <rect class="box" x="32" y="176" width="136" height="52" rx="3"/>
  <text x="100" y="194" text-anchor="middle">Transformer P<tspan class="sub" baseline-shift="sub">tr</tspan></text>
  <text class="s" x="100" y="208" text-anchor="middle">inflexible load, PV</text>
  <text class="s" x="100" y="220" text-anchor="middle">limits C(t), C<tspan class="sub" baseline-shift="sub">rev</tspan>(t)</text>
  <rect class="box" x="32" y="236" width="136" height="52" rx="3"/>
  <text x="100" y="254" text-anchor="middle">Prices</text>
  <text class="s" x="100" y="268" text-anchor="middle">c<tspan class="sub" baseline-shift="super">ch</tspan>(t), c<tspan class="sub" baseline-shift="super">dis</tspan>(t)</text>
  <text class="s" x="100" y="280" text-anchor="middle">and short forecast</text>

  <!-- arrow env -> obs -->
  <line class="ln" x1="180" y1="185" x2="208" y2="185" marker-end="url(#arr)"/>

  <!-- 2. Observation -->
  <rect class="grp" x="210" y="70" width="170" height="230" rx="6"/>
  <text class="h" x="295" y="90" text-anchor="middle">Observation (set)</text>
  <text class="s" x="295" y="104" text-anchor="middle">no charger index or position</text>
  <rect class="box" x="222" y="116" width="146" height="58" rx="3"/>
  <text x="295" y="134" text-anchor="middle">Global token ξ<tspan class="sub" baseline-shift="sub">0</tspan></text>
  <text class="s" x="295" y="148" text-anchor="middle">prices, forecasts, time,</text>
  <text class="s" x="295" y="160" text-anchor="middle">C, C<tspan class="sub" baseline-shift="sub">rev</tspan>, load, PV, Σl, Σu</text>
  <!-- stacked charger tokens -->
  <rect class="box" x="228" y="190" width="142" height="80" rx="3"/>
  <rect class="box" x="225" y="186" width="142" height="80" rx="3"/>
  <rect class="box" x="222" y="182" width="142" height="80" rx="3"/>
  <text x="293" y="199" text-anchor="middle">Charger tokens ξ<tspan class="sub" baseline-shift="sub">1</tspan> … ξ<tspan class="sub" baseline-shift="sub">N</tspan></text>
  <text class="s" x="293" y="214" text-anchor="middle">energy, required energy</text>
  <text class="s" x="293" y="226" text-anchor="middle">steps to departure τ<tspan class="sub" baseline-shift="sub">i</tspan></text>
  <text class="s" x="293" y="238" text-anchor="middle">laxity, power limits</text>
  <text class="s" x="293" y="250" text-anchor="middle">bounds l<tspan class="sub" baseline-shift="sub">i</tspan>, u<tspan class="sub" baseline-shift="sub">i</tspan></text>
  <text class="lab" x="295" y="290" text-anchor="middle">empty chargers are masked</text>

  <!-- arrow obs -> policy -->
  <line class="ln" x1="380" y1="185" x2="408" y2="185" marker-end="url(#arr)"/>

  <!-- 3. Attention policy -->
  <rect class="grp" x="410" y="70" width="210" height="230" rx="6"/>
  <text class="h" x="515" y="90" text-anchor="middle">Attention policy (actor)</text>
  <text class="s" x="515" y="104" text-anchor="middle">same weights for any N</text>
  <rect class="box" x="422" y="114" width="186" height="40" rx="3"/>
  <text x="515" y="130" text-anchor="middle">Linear embedding + type embedding</text>
  <text class="s" x="515" y="144" text-anchor="middle">no positional encoding</text>
  <line class="ln" x1="515" y1="154" x2="515" y2="164" marker-end="url(#arr)"/>
  <rect class="box" x="422" y="166" width="186" height="62" rx="3"/>
  <text x="515" y="183" text-anchor="middle">Transformer encoder × n<tspan class="sub" baseline-shift="sub">L</tspan></text>
  <text class="s" x="515" y="197" text-anchor="middle">pre-LayerNorm, multi-head</text>
  <text class="s" x="515" y="209" text-anchor="middle">self-attention with key-padding</text>
  <text class="s" x="515" y="222" text-anchor="middle">mask, feed-forward</text>
  <line class="ln" x1="515" y1="228" x2="515" y2="236" marker-end="url(#arr)"/>
  <rect class="box" x="422" y="238" width="186" height="52" rx="3"/>
  <text x="515" y="255" text-anchor="middle">Shared per-token actor head</text>
  <text class="s" x="515" y="269" text-anchor="middle">MLP applied to each charger</text>
  <text class="s" x="515" y="281" text-anchor="middle">output: μ<tspan class="sub" baseline-shift="sub">i</tspan>, σ<tspan class="sub" baseline-shift="sub">i</tspan> (Gaussian)</text>

  <!-- arrow policy -> sample -->
  <line class="ln" x1="620" y1="262" x2="648" y2="262" marker-end="url(#arr)"/>

  <!-- 4. Raw action -->
  <rect class="box" x="650" y="222" width="110" height="78" rx="3"/>
  <text class="h" x="705" y="240" text-anchor="middle">Raw action</text>
  <text class="s" x="705" y="256" text-anchor="middle">a<tspan class="sub" baseline-shift="sub">i</tspan> ~ N(μ<tspan class="sub" baseline-shift="sub">i</tspan>, σ<tspan class="sub" baseline-shift="sub">i</tspan><tspan class="sub" baseline-shift="super">2</tspan>)</text>
  <text class="s" x="705" y="270" text-anchor="middle">x<tspan class="sub" baseline-shift="sub">i</tspan> = P<tspan class="sub" baseline-shift="sub">ref</tspan> a<tspan class="sub" baseline-shift="sub">i</tspan> (kW)</text>
  <text class="s" x="705" y="284" text-anchor="middle">unbounded</text>

  <!-- arrow sample -> safety -->
  <path class="ln" d="M760,262 L772,262 L772,250 L778,250" marker-end="url(#arr)"/>

  <!-- 5. Safety layer -->
  <rect class="safe" x="780" y="70" width="200" height="230" rx="6"/>
  <text class="h" x="880" y="90" text-anchor="middle">Safety layer Π<tspan class="sub" baseline-shift="sub">t</tspan></text>
  <text class="s" x="880" y="104" text-anchor="middle">training and deployment</text>
  <rect class="box" x="792" y="112" width="176" height="44" rx="3"/>
  <text x="880" y="128" text-anchor="middle">Per-EV bounds l<tspan class="sub" baseline-shift="sub">i</tspan>, u<tspan class="sub" baseline-shift="sub">i</tspan></text>
  <text class="s" x="880" y="141" text-anchor="middle">reachable energy before departure</text>
  <text class="s" x="880" y="152" text-anchor="middle">(τ<tspan class="sub" baseline-shift="sub">i</tspan>, or conformal bound τ<tspan class="sub" baseline-shift="sub">i</tspan><tspan class="sub" baseline-shift="super">lo</tspan>)</text>
  <rect class="box" x="792" y="162" width="176" height="28" rx="3"/>
  <text x="880" y="180" text-anchor="middle">−C<tspan class="sub" baseline-shift="sub">rev</tspan>(t) ≤ Σ<tspan class="sub" baseline-shift="sub">i</tspan> p<tspan class="sub" baseline-shift="sub">i</tspan> ≤ C̃(t)</text>
  <rect class="box" x="792" y="196" width="176" height="44" rx="3"/>
  <text x="880" y="212" text-anchor="middle">p<tspan class="sub" baseline-shift="sub">i</tspan> = clip(x<tspan class="sub" baseline-shift="sub">i</tspan> − λ, l<tspan class="sub" baseline-shift="sub">i</tspan>, u<tspan class="sub" baseline-shift="sub">i</tspan>)</text>
  <text class="s" x="880" y="226" text-anchor="middle">Euclidean projection; scalar λ</text>
  <text class="s" x="880" y="237" text-anchor="middle">by sorting or bisection</text>
  <rect class="box" x="792" y="246" width="176" height="44" rx="3"/>
  <text x="880" y="262" text-anchor="middle">Fallback rule</text>
  <text class="s" x="880" y="276" text-anchor="middle">only if the feasible set is empty;</text>
  <text class="s" x="880" y="287" text-anchor="middle">least laxity first, logged</text>

  <!-- feedback p(t) -> environment -->
  <path class="ln" d="M880,300 L880,330 L100,330 L100,302" marker-end="url(#arr)"/>
  <text class="lab" x="490" y="324" text-anchor="middle">executed power p(t) (kW), mapped to the EV2Gym action grid</text>

  <!-- 6. Critic (training only) -->
  <path class="lnd" d="M295,300 L295,401 L408,401" marker-end="url(#arr)"/>
  <rect class="dash" x="410" y="370" width="210" height="62" rx="4"/>
  <text class="h" x="515" y="388" text-anchor="middle">Critic V<tspan class="sub" baseline-shift="sub">ω</tspan>(s)</text>
  <text class="s" x="515" y="403" text-anchor="middle">separate encoder of the same form,</text>
  <text class="s" x="515" y="415" text-anchor="middle">attention pooling with one learned</text>
  <text class="s" x="515" y="427" text-anchor="middle">query; invariant to charger order</text>

  <!-- 7. PPO update (training only) -->
  <rect class="dash" x="650" y="370" width="330" height="62" rx="4"/>
  <text class="h" x="815" y="388" text-anchor="middle">PPO update</text>
  <text class="s" x="815" y="403" text-anchor="middle">clipped surrogate on log π(a | s) of the raw sample</text>
  <text class="s" x="815" y="415" text-anchor="middle">(projection treated as part of the environment)</text>
  <text class="s" x="815" y="427" text-anchor="middle">+ value loss + β ‖x − Π<tspan class="sub" baseline-shift="sub">t</tspan>(x)‖² regulariser</text>
  <line class="lnd" x1="620" y1="401" x2="648" y2="401" marker-end="url(#arr)"/>
  <text class="lab" x="300" y="390" text-anchor="start">state s(t)</text>

  <!-- reward path -->
  <path class="lnd" d="M45,300 L45,470 L815,470 L815,434" marker-end="url(#arr)"/>
  <text class="lab" x="430" y="464" text-anchor="middle">reward r(t): step profit in € (no penalty for constraints enforced by the safety layer)</text>

  <!-- legend -->
  <line class="ln" x1="30" y1="500" x2="70" y2="500"/>
  <text class="s" x="78" y="504">control loop (training and deployment)</text>
  <line class="lnd" x1="300" y1="500" x2="340" y2="500"/>
  <text class="s" x="348" y="504">training only</text>
  <rect class="safe" x="460" y="492" width="22" height="16" rx="2"/>
  <text class="s" x="490" y="504">safety layer (closed-form projection; feasibility preserved under stated conditions)</text>
</svg>
